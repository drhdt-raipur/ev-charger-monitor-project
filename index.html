<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charger Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .data-card {
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
        }
        .status-dot {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.5s;
        }
        .charging { background-color: #34D399; } /* Green */
        .available { background-color: #3B82F6; } /* Blue */
        .offline { background-color: #F87171; } /* Red */
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div id="loading-spinner" class="flex justify-center items-center h-screen">
        <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-indigo-600"></div>
    </div>

    <div id="app-container" class="hidden max-w-4xl mx-auto">
        <header class="mb-8 p-4 bg-white rounded-xl shadow-lg">
            <h1 class="text-3xl font-extrabold text-gray-900 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-600 mr-3" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm3 14H9v-3H6v-2h3V8h6v3h3v2h-3v3z"/>
                </svg>
                EV Charger Monitor
            </h1>
            <p class="text-sm text-gray-500 mt-2">
                User ID: <span id="user-id" class="font-mono text-xs bg-gray-100 px-2 py-0.5 rounded">...</span>
            </p>
        </header>

        <div class="mb-8 p-6 bg-white rounded-xl data-card border-l-4 border-indigo-600">
            <div class="flex items-center justify-between">
                <h2 class="text-2xl font-semibold text-gray-800">Charger Status</h2>
                <button id="action-button" class="px-6 py-2 rounded-full font-bold text-white transition-all transform hover:scale-105 active:scale-95 shadow-md">
                    Start Charging
                </button>
            </div>
            <div class="mt-4 flex items-center">
                <span id="status-dot" class="status-dot mr-3"></span>
                <span id="charger-status" class="text-4xl font-extrabold text-gray-900">Loading...</span>
            </div>
            <p id="session-time" class="text-sm text-gray-500 mt-2">Last Update: ...</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="p-6 bg-white rounded-xl data-card hover:shadow-xl">
                <p class="text-sm font-medium text-gray-500">Current Power</p>
                <div class="mt-1 flex items-end">
                    <span id="current-power" class="text-3xl font-extrabold text-indigo-600">0.0</span>
                    <span class="ml-2 text-base text-gray-500">kW</span>
                </div>
            </div>

            <div class="p-6 bg-white rounded-xl data-card hover:shadow-xl">
                <p class="text-sm font-medium text-gray-500">Energy Delivered</p>
                <div class="mt-1 flex items-end">
                    <span id="energy-delivered" class="text-3xl font-extrabold text-indigo-600">0.00</span>
                    <span class="ml-2 text-base text-gray-500">kWh</span>
                </div>
            </div>

            <div class="p-6 bg-white rounded-xl data-card hover:shadow-xl">
                <p class="text-sm font-medium text-gray-500">Session Duration</p>
                <div class="mt-1 flex items-end">
                    <span id="session-duration" class="text-3xl font-extrabold text-indigo-600">00:00:00</span>
                </div>
            </div>
        </div>

        <div class="p-6 bg-white rounded-xl data-card">
            <h3 class="text-xl font-semibold text-gray-800 mb-4">Live Updates</h3>
            <ul id="log-list" class="space-y-2 text-sm max-h-48 overflow-y-auto">
                <li class="text-gray-500">Waiting for data...</li>
            </ul>
        </div>
    </div>

    <script type="module" src="./dashboard.js"></script>
</body>
</html>
