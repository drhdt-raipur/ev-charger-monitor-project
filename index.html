<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charger Interface - Start Session</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 30px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; transition: background-color 0.3s; }
        button:hover { background-color: #218838; }
        #message { text-align: center; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ EV Charging Station</h2>
        <form id="chargeForm">
            <label for="vehicleNumber">Vehicle Number:</label>
            <input type="text" id="vehicleNumber" required placeholder="e.g., MH12AB1234">

            <label for="amountPaid">Amount Paid (₹):</label>
            <input type="number" id="amountPaid" min="10" step="0.01" required placeholder="Minimum ₹10">

            <button type="submit">Start Charging Session</button>
        </form>
        <p id="message"></p>
        <p style="text-align: center; margin-top: 15px;">
            <a href="dashboard.html">View Live Dashboard</a>
        </p>
    </div>

    <script type="module">
        // Import the sessionsRef from the shared script
        import { sessionsRef } from './scripts.js';

        const form = document.getElementById('chargeForm');
        const message = document.getElementById('message');

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Stop the form from reloading the page

            const vehicleNumber = document.getElementById('vehicleNumber').value.toUpperCase().trim();
            const amountPaid = parseFloat(document.getElementById('amountPaid').value);
            const startTime = Date.now(); // Get the current time as a Unix timestamp

            if (!vehicleNumber || isNaN(amountPaid) || amountPaid < 10) {
                message.textContent = 'Please enter a valid Vehicle Number and Amount Paid (min ₹10).';
                message.style.color = 'red';
                return;
            }

            // Create a new unique entry in the 'chargingSessions' node
            // .push() creates a new unique key for the session
            sessionsRef.push({
                vehicleNumber: vehicleNumber,
                amountPaid: amountPaid,
                startTime: startTime
            })
            .then(() => {
                message.textContent = `✅ Session for ${vehicleNumber} started successfully!`;
                message.style.color = 'green';
                form.reset(); // Clear the form
            })
            .catch(error => {
                message.textContent = `❌ Error starting session: ${error.message}`;
                message.style.color = 'red';
                console.error("Firebase write error: ", error);
            });
        });
    </script>
</body>
</html>
