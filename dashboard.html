<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live EV Charging Dashboard</title>
    <!-- Load Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font and shadow for better aesthetics */
        body { font-family: 'Inter', sans-serif; background-color: #e2e8f0; }
        .card { 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06); 
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-extrabold text-gray-800 mb-2 border-b pb-2">Live EV Charging Dashboard</h1>
        <p class="text-gray-600 mb-6">Real-time view of all active charging sessions across the network.</p>
        
        <!-- Authentication Status Indicator -->
        <div id="authStatus" class="mb-4 text-xs text-center p-2 rounded-lg bg-yellow-100 text-yellow-700 font-semibold">
            Initializing Firebase...
        </div>

        <!-- Display User ID (Important for collaboration context) -->
        <div class="mt-4 text-gray-600 text-sm">
            Current User ID: <span id="displayUserId" class="font-mono text-gray-800">...</span>
        </div>

        <!-- Session Display Area -->
        <div id="sessionsList" class="space-y-4 mt-6">
            <p id="loadingMessage" class="text-center text-gray-500">Connecting to database...</p>
        </div>

        <p class="text-center text-sm text-gray-400 mt-6">
            Go to <a href="index.html" class="text-indigo-600 hover:text-indigo-800 font-medium">Input Form</a> to start a new session.
        </p>
    </div>

    <script type="module">
        // The import statement is simplified to 'scripts.js' to fix module resolution errors.
        import { getChargingSessionsCollection, isAuthReady, currentUserId } from 'scripts.js';
        import { query, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const sessionsList = document.getElementById('sessionsList');
        const loadingMessage = document.getElementById('loadingMessage');
        const authStatus = document.getElementById('authStatus');
        const displayUserId = document.getElementById('displayUserId');

        /**
         * Renders the list of charging sessions into the DOM.
         * @param {Array<Object>} sessions - The list of session data retrieved from Firestore.
         */
        function renderSessions(sessions) {
            sessionsList.innerHTML = ''; // Clear existing list
            
            if (sessions.length === 0) {
                sessionsList.innerHTML = '<p class="text-center text-2xl py-10 text-gray-400 border-2 border-dashed rounded-xl mt-8">🔋 No active charging sessions found.</p>';
                return;
            }

            sessions.forEach(session => {
                // Format the timestamp for display
                const date = session.startTime ? new Date(session.startTime).toLocaleString() : 'N/A (Pending)';
                
                const sessionCard = document.createElement('div');
                sessionCard.className = 'bg-white p-5 rounded-xl card border-l-4 border-indigo-500 hover:shadow-lg transition duration-200';
                
                // Card content using the session data
                sessionCard.innerHTML = `
                    <div class="flex justify-between items-start">
                        <h2 class="text-2xl font-bold text-gray-900">${session.vehicleNumber}</h2>
                        <span class="text-sm font-medium text-white px-3 py-1 rounded-full bg-green-600">${session.status.toUpperCase()}</span>
                    </div>
                    <div class="mt-3 text-gray-700 space-y-1 text-sm">
                        <p><strong>Amount Paid:</strong> <span class="text-lg font-semibold text-indigo-600">₹${session.amountPaid.toFixed(2)}</span></p>
                        <p><strong>Start Time:</strong> ${date}</p>
                        <p class="text-xs text-gray-500 mt-2"><strong>Session ID:</strong> <span class="font-mono">${session.id}</span></p>
                        <p class="text-xs text-gray-500"><strong>Initiated By:</strong> <span class="font-mono">${session.userId}</span></p>
                    </div>
                `;
                sessionsList.appendChild(sessionCard);
            });
        }

        /**
         * Sets up the Firestore real-time listener to fetch and update sessions.
         */
        function setupRealtimeListener() {
            // Guard clause: ensure authentication is ready before querying Firestore
            if (!isAuthReady || !currentUserId) {
                return;
            }

            const sessionsColRef = getChargingSessionsCollection();
            
            // Create a query: Get all documents, ordered by start time descending
            const q = query(sessionsColRef, orderBy('startTime', 'desc'));

            // onSnapshot sets up the real-time listener
            const unsubscribe = onSnapshot(q, (snapshot) => {
                loadingMessage.style.display = 'none'; // Hide loading message
                
                const sessions = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Filter out the placeholder document
                    if (doc.id === '_placeholder' && data._placeholder === true) {
                        return;
                    }

                    // Convert Firestore Timestamp object to JavaScript milliseconds for display
                    // The 'toMillis' function is only present on resolved server timestamps.
                    const startTimeMs = data.startTime && typeof data.startTime.toMillis === 'function' 
                                      ? data.startTime.toMillis() 
                                      : null; 
                    
                    sessions.push({
                        id: doc.id,
                        startTime: startTimeMs,
                        ...data
                    });
                });

                renderSessions(sessions);
            }, (error) => {
                console.error("Firestore listener error:", error);
                sessionsList.innerHTML = `<p class="text-center text-xl text-red-600 p-4 border border-red-300 rounded-lg">❌ Error loading data: ${error.message}</p>`;
            });

            // Clean up the listener when the page is unloaded
            window.onbeforeunload = unsubscribe;
        }

        /**
         * Handles the custom 'authReady' event dispatched by scripts.js.
         */
        function handleAuthReady() {
            // Update UI to reflect successful authentication
            authStatus.textContent = `Status: Authenticated. User ID starts with ${currentUserId.substring(0, 8)}...`;
            authStatus.classList.remove('bg-yellow-100', 'text-yellow-700');
            authStatus.classList.add('bg-green-100', 'text-green-700');
            displayUserId.textContent = currentUserId;
            
            // Start listening for data once authenticated
            setupRealtimeListener();
        }

        // 1. Wait for the custom event fired by scripts.js before starting the listener
        window.addEventListener('authReady', handleAuthReady);
        
        // 2. Immediate check: If scripts.js loaded faster and already set the flag, run the handler immediately.
        if (isAuthReady) {
             handleAuthReady(); 
        }
    </script>
</body>
</html>
