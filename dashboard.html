<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EV Charger Monitoring Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.8/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.8/firebase-database-compat.js"></script>
  <style>
    body { font-family: sans-serif; padding: 24px; background: #f8f8f8; }
    h1 { color: #2c387e; }
    .stat { font-size: 1.15em; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { padding: 10px 8px; border: 1px solid #e0e0e0; }
    th { background: #e3eafc; }
    .vehicle { font-weight: 600; }
    button.stop { background: #dc3545; color: #fff; border: none; padding: 6px 13px; border-radius: 5px; cursor: pointer;}
    button.stop:hover { background: #a22633; }
  </style>
</head>
<body>
  <h1>EV Charger Dashboard</h1>
  <div class="stat">Chargers Online: <span id="onlineNum">0</span></div>
  <div class="stat">Total Power Used (Watt): <span id="powerUsage">0.00</span></div>
  <div class="stat">Live Charging Sessions:</div>
  <table>
    <thead>
      <tr>
        <th>Vehicle Number</th>
        <th>Amount Paid</th>
        <th>Charging Since</th>
        <th>Duration</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="sessionsList">
      <!-- Live data here -->
    </tbody>
  </table>

  <script>
    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDJQbgJK4GpvmLEchh0-2mWjrUW3ZAN2QI",
      authDomain: "ev-charger-monitor-85a48.firebaseapp.com",
      projectId: "ev-charger-monitor-85a48",
      storageBucket: "ev-charger-monitor-85a48.firebasestorage.app",
      messagingSenderId: "22222071413",
      appId: "1:22222071413:web:d5a26ffd2a9014cc10fa3c",
      measurementId: "G-PYKSBZ6XHW",
      databaseURL: "https://ev-charger-monitor-85a48-default-rtdb.firebaseio.com"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const POWER_PER_SECOND = 0.01; // watts/second/charger
    let liveSessions = {};
    let sessionKeys = {};

    // Listen for changes in charging_sessions
    db.ref("charging_sessions").on("value", function(snapshot) {
      const data = snapshot.val() || {};
      liveSessions = {};
      sessionKeys = {};
      Object.keys(data).forEach(key => {
        if (data[key].active) {
          liveSessions[key] = data[key];
        }
      });
      updateDashboard();
    });

    function updateDashboard() {
      // Update charger count
      const numOnline = Object.keys(liveSessions).length;
      document.getElementById("onlineNum").innerText = numOnline;

      // Build session table rows
      const tbody = document.getElementById("sessionsList");
      tbody.innerHTML = "";
      const now = Date.now();

      let totalPower = 0;

      Object.entries(liveSessions).forEach(([key, sess]) => {
        // Duration in seconds
        const since = Number(sess.start_time) || 0;
        const duration = Math.round((now - since) / 1000);
        totalPower += duration * POWER_PER_SECOND;

        // Each row now has a Stop button!
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="vehicle">${sess.vehicle_number}</td>
          <td>${sess.amount_paid}</td>
          <td>${new Date(since).toLocaleTimeString()}</td>
          <td>${Math.floor(duration / 60)}m ${duration % 60}s</td>
          <td><button class="stop" data-key="${key}">Stop</button></td>
        `;
        tbody.appendChild(row);
      });

      document.getElementById("powerUsage").innerText = totalPower.toFixed(2);

      // Set event listeners for all Stop buttons
      Array.from(document.getElementsByClassName('stop')).forEach(button => {
        button.onclick = function() {
          const key = this.getAttribute('data-key');
          if(confirm("Stop charging for this vehicle?")) {
            db.ref("charging_sessions/" + key).update({active: false});
          }
        };
      });
    }

    setInterval(updateDashboard, 1000); // keep durations and power live
  </script>
</body>
</html>
